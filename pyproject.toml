[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "releaserail"
version = "1.0.0"
description = "GitOps delivery controller with health gates and automated rollback."
readme = "README.md"
requires-python = ">=3.11"
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]
[project.scripts]
releaserail-demo = "releaserail.demo:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=releaserail --cov-report=term-missing --cov-fail-under=85"
[tool.coverage.run]
omit = ["src/releaserail/demo.py"]
[tool.ruff]
line-length = 100
target-version = "py311"
